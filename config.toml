host = "127.0.0.1"
port = 8888
admin_user = "admin"
# Generate with ./lightpanel -hash-password; or set LP_PASS_HASH.
password_hash = ""
# 上传大小上限（MiB），默认 32。
max_upload_mb = 32
public_origin = "http://127.0.0.1:8888"
read_only = false
# 在线更新：从 GitHub Releases 检查并下载官方二进制（SHA256 校验后替换）。
update_repo = "acleverfreebird/lightpanel-go"
# 直连 GitHub 受限时，可填一个镜像站点源（如 https://ghproxy 家族），留空直连。
update_mirror = ""
tls_cert = ""
tls_key = ""
log_file = ""

# 最小特权 helper：非 root 面板把 root 级操作转发给 lightpanel-helper 服务，
# 由其按下列白名单授权执行。面板以 root 运行时本段被忽略。详见 README。
[helper]
allowed_users = ["lightpanel"]
allow_firewall = true
allow_kill = true
allow_update = true
# allow_sites = true 时 helper 授权托管站点操作：写入站点配置（内容在
# helper 端从校验后的参数重新生成）、删除带托管标记的配置、重载引擎与
# certbot 证书签发。最小特权模式下创建站点需要打开它。
allow_sites = true
# allow_apps = true 时 helper 授权应用商店安装：通过系统软件包管理器安装
# 固定目录中的应用（nginx/apache/docker/certbot）；应用名经白名单校验，
# 全部安装参数在 helper 端重建。最小特权模式下应用商店安装需要打开它。
allow_apps = true
# socket = "/run/lightpanel/helper.sock"
# staging_dir = "/var/lib/lightpanel/update"

# 按服务/动作细分授权：单元名 = 允许的 systemd 动作（start/stop/restart）。
# 空表 = 拒绝一切服务控制；"*" 条目把动作授予所有单元（旧版行为）。
[helper.services]
"nginx.service" = ["start", "stop", "restart"]
