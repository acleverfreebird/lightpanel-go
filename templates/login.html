<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · LightPanel</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/login.css">
</head>
<body class="login">
  <section class="login-story" aria-label="LightPanel 服务器工作台">
    <a class="brand" href="/login"><span class="brand-mark" aria-hidden="true">↳</span>LightPanel<span class="brand-dot"></span></a>
    <div class="story-content">
      <div class="eyebrow">LESS OVERHEAD. MORE CONTROL.</div>
      <h1>轻一点，<br>掌控多一点<span>。</span></h1>
      <p>让复杂的运维，回归简单。<br>你的服务器、应用与数据，尽在一个清晰的工作台。</p>
      <div class="server-art" aria-hidden="true">
        <div class="orbit orbit-one"></div><div class="orbit orbit-two"></div>
        <div class="art-caption">YOUR INFRASTRUCTURE, IN FOCUS.</div>
        <div class="server-stack">
          <div class="server-unit"><span class="unit-number">01</span><i></i><i></i><i></i><b></b></div>
          <div class="server-unit"><span class="unit-number">02</span><i></i><i></i><i></i><b></b></div>
          <div class="server-unit"><span class="unit-number">03</span><i></i><i></i><i></i><b></b></div>
        </div>
        <div class="art-label"><span></span> BUILT TO RUN LIGHT.</div>
      </div>
    </div>
    <div class="story-footer"><span>轻量架构</span><span>清晰洞察</span><span>从容管理</span></div>
  </section>
  <main class="login-main">
    <div class="login-card">
      <div class="login-step"><span></span> YOUR WORKSPACE</div>
      <h2>欢迎回来<span>。</span></h2>
      <p class="muted">登录 LightPanel，开始今天的管理。</p>
      <form method="post" action="/login">
        <label>管理员账号<input name="username" autocomplete="username" required maxlength="128" placeholder="输入用户名" autofocus></label>
        <label>登录密码<input name="password" type="password" autocomplete="current-password" required maxlength="72" placeholder="输入密码"></label>
        <button type="submit">进入工作台 <span aria-hidden="true">→</span></button>
      </form>
      <div class="login-note">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 5-8 9-8 9S4 17 4 12V6z M8 12l3 3 5-6"/></svg>
        <p>仅限授权管理员访问。<br>请通过可信连接登录你的服务器。</p>
      </div>
    </div>
    <footer class="login-footer"><span>LightPanel</span><span>专注管理，轻装运行。</span></footer>
  </main>
</body>
</html>
