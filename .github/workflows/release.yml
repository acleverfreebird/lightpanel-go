name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build release binaries
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o dist/lightpanel-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o dist/lightpanel-linux-arm64 .
      - name: Generate checksums
        working-directory: dist
        run: sha256sum lightpanel-linux-amd64 lightpanel-linux-arm64 > SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lightpanel-linux-amd64
            dist/lightpanel-linux-arm64
            dist/SHA256SUMS
          generate_release_notes: true
