name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -count=1 ./...
      - name: Verify module integrity
        run: go mod verify
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Front-end unit tests
        run: node --test scripts/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build linux/amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/lightpanel-linux-amd64 .
      - name: Build linux/arm64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o dist/lightpanel-linux-arm64 .

  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build test binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/lightpanel-linux-amd64 .
      - name: Local HTTP smoke test
        run: python3 scripts/smoke.py dist/lightpanel-linux-amd64
